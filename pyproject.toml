[project]
name = "jev-laya-benchmark"
version = "0.1.0"
description = "Benchmark Jev vs Laya (Default e Ajustado): Scores e Tempo de Resposta"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "laya>=0.3.20",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "datasets>=3.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jl-bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
